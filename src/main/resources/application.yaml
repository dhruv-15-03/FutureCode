server:
  address: ${HOST:127.0.0.1}
  port: ${PORT:4317}
  forward-headers-strategy: none
  max-http-request-header-size: 16KB
  shutdown: graceful
  tomcat:
    threads:
      max: 16
      min-spare: 2
    max-connections: 256
    accept-count: 32
    connection-timeout: 10s
    keep-alive-timeout: 5s
    max-keep-alive-requests: 100
  error:
    include-message: never
    include-stacktrace: never
    include-exception: false
  compression:
    enabled: true
    min-response-size: 1KB
    mime-types: text/html,text/css,text/javascript,application/javascript,application/json,image/svg+xml
spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: futurecode
  main:
    banner-mode: off
  web:
    resources:
      add-mappings: false
  lifecycle:
    timeout-per-shutdown-phase: 10s
logging:
  level:
    root: WARN
    io.futurecode: INFO
    org.springframework.security: WARN
    org.springframework.web.servlet.PageNotFound: "OFF"
    com.zaxxer.hikari: WARN
    org.flywaydb: WARN
futurecode:
  integrations:
    execution-enabled: ${EXECUTION_ENABLED:false}
    payments-enabled: ${PAYMENTS_ENABLED:false}
    razorpay-key-id: ${RAZORPAY_KEY_ID:}
    razorpay-key-secret: ${RAZORPAY_KEY_SECRET:}
    razorpay-webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
    support-amount-paise: ${SUPPORT_AMOUNT_PAISE:0}
  command: ${FUTURECODE_COMMAND:serve}
  admin-user-id: ${FUTURECODE_ADMIN_USER_ID:}
  environment: ${APP_ENV:${NODE_ENV:development}}
  origin: ${APP_ORIGIN:http://127.0.0.1:${PORT:4317}}
  bind-address: ${server.address}
  database-url: ${DATABASE_URL:}
  database-schema: ${DATABASE_SCHEMA:FutureTool}
  mysql-tls: ${MYSQL_TLS:}
  mysql-ca-file: ${MYSQL_CA_FILE:}
  connection-limit: ${MYSQL_CONNECTION_LIMIT:4}
  google-client-id: ${GOOGLE_CLIENT_ID:}
  google-client-secret: ${GOOGLE_CLIENT_SECRET:}
  session-secret: ${SESSION_SECRET:}
  max-users: ${MAX_USERS:200}
  max-problems: ${MAX_PROBLEMS:500}
  max-problems-per-user: ${MAX_PROBLEMS_PER_USER:10}
  max-saved-attempts: ${MAX_SAVED_ATTEMPTS:20}
  provider-concurrency: ${PROVIDER_CONCURRENCY:8}
