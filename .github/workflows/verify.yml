name: Verify without deploying

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: development
      DATABASE_URL: ""
      GOOGLE_CLIENT_ID: ""
      GOOGLE_CLIENT_SECRET: ""
      SESSION_SECRET: ""
      MYSQL_CA_FILE: ""
      EXECUTION_ENABLED: "false"
      PAYMENTS_ENABLED: "false"
      FUTURECODE_ALLOW_TEST_WRITES: "no"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install development dependencies
        run: |
          npm ci
          python -m pip install -r ops/cost_guard/requirements.txt
      - name: Verify operations and deployment hold
        run: python -m unittest discover -s ops/tests -v
      - name: Verify browser and backend content agree
        run: npm run check
      - name: Build and test Java application
        run: ./mvnw -B -q verify
      - name: Verify trusted authored fixtures
        run: npm test
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Verify application journeys
        run: npm run test:browser -- --workers=2
      - name: Build containers on this runner only
        run: |
          docker build --tag futurecode-app-verify .
          docker build --file ops/cost_guard/Dockerfile --tag futurecode-guard-verify .
          echo "Uncompressed local image sizes; not a registry billing balance:" >> "$GITHUB_STEP_SUMMARY"
          docker image inspect futurecode-app-verify futurecode-guard-verify --format '{{.RepoTags}} {{.Size}} bytes' >> "$GITHUB_STEP_SUMMARY"
      - name: Smoke-test production runtime without credentials
        shell: bash
        run: |
          container=futurecode-runtime-smoke
          trap 'docker rm --force "$container" >/dev/null 2>&1 || true' EXIT
          docker run --detach --name "$container" \
            --env APP_ENV=development --env HOST=127.0.0.1 --env PORT=8080 \
            --env APP_ORIGIN=http://127.0.0.1:8080 futurecode-app-verify
          ready=false
          for attempt in $(seq 1 30); do
            if docker exec "$container" bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080; printf "GET /livez HTTP/1.1\r\nHost: 127.0.0.1:8080\r\nConnection: close\r\n\r\n" >&3; cat <&3' 2>/dev/null | grep '"status":"ok"' >/dev/null; then
              ready=true
              break
            fi
            sleep 2
          done
          if [ "$ready" != true ]; then
            docker logs "$container"
            exit 1
          fi
          docker exec "$container" bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080; printf "GET /api/catalog HTTP/1.1\r\nHost: 127.0.0.1:8080\r\nConnection: close\r\n\r\n" >&3; cat <&3' | grep 'The missing requests' >/dev/null
          docker run --rm futurecode-guard-verify python -c 'import main, guard, gcp_backend; print("Guard runtime imports without credentials.")'
